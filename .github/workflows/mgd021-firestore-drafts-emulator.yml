name: MGD-021 Firestore drafts emulator (isolated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mi-lu-gran-dia-reestructuracion/tests/firestore-drafts/**'
      - '.github/workflows/mgd021-firestore-drafts-emulator.yml'

permissions:
  contents: read

jobs:
  emulator-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: mi-lu-gran-dia-reestructuracion
    env:
      FIREBASE_PROJECT_ID: demo-mgd021-invitation-drafts
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing@^5 firebase@^12 firebase-tools@^14
      - name: Run local Firestore emulator security rules tests
        run: npx firebase emulators:exec --project demo-mgd021-invitation-drafts --only firestore --config tests/firestore-drafts/firebase.json "node --test tests/firestore-drafts/rules.test.mjs"
