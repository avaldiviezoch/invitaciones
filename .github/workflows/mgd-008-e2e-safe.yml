name: MGD-008 E2E seguro

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mi-lu-gran-dia-reestructuracion/**'
      - '.github/workflows/mgd-008-e2e-safe.yml'

# Un único run por PR; nuevas revisiones cancelan ejecuciones obsoletas.
concurrency:
  group: mgd-safe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-safe:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: mi-lu-gran-dia-reestructuracion

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias E2E
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Este job NO carga storage-state ni autenticación; nunca ejecuta suites fixture.
      - name: Ejecutar MGD-008A seguro
        run: npm run test:e2e:safe
        env:
          MIGRANDIA_E2E_URL: https://avaldiviezoch.github.io/invitaciones/mi-lu-gran-dia-reestructuracion/

      - name: Conservar evidencia cuando falla el QA
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mgd-safe-failure-${{ github.run_id }}
          path: |
            mi-lu-gran-dia-reestructuracion/test-results/
            mi-lu-gran-dia-reestructuracion/playwright-report/
          if-no-files-found: warn
          retention-days: 7
