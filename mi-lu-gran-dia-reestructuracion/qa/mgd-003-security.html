<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MGD-003 · QA seguridad RSVP</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f3ee;color:#2e2c2a;margin:0;padding:24px}
    main{max-width:720px;margin:auto;background:#fff;border:1px solid #e1d9d0;border-radius:18px;padding:24px}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;background:#f7f7f7;border-radius:12px;padding:14px;min-height:80px}
    .note{background:#fff4d6;border-radius:12px;padding:12px 14px;margin-bottom:16px}
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
<main>
  <div class="note"><strong>QA MGD-003.</strong> Esta página no escribe RSVP ni Firestore. Solo valida Turnstile + Worker DEV + rate limit.</div>
  <h1>Protección RSVP</h1>
  <p>Primero ejecuta una validación normal. Luego repite varias veces para comprobar el 429 controlado.</p>
  <div id="turnstile"></div>
  <p id="turnstile-status"><strong>Turnstile:</strong> cargando…</p>
  <p><button id="verify" type="button" disabled>Validar seguridad</button></p>
  <pre id="out">Esperando que Turnstile quede listo.</pre>
</main>
<script>
const ENDPOINT='https://migrandia-dev.avaldiviezoch.workers.dev/api/rsvp/verify';
const SITE_KEY='1x00000000000000000000AA';
const RSVP_TOKEN='mgd003-qa-security-only';
const RESPONSE_ID='mgd003-qa-fixed-response';
let widgetId=null;
let token='';
const verifyButton=document.getElementById('verify');
const statusNode=document.getElementById('turnstile-status');
function setReady(value){
  verifyButton.disabled=!value;
  statusNode.innerHTML='<strong>Turnstile:</strong> '+(value?'listo ✓':'esperando token…');
}
function render(){
  if(widgetId!==null||!window.turnstile)return;
  statusNode.innerHTML='<strong>Turnstile:</strong> script cargado, inicializando widget…';
  try{
    widgetId=turnstile.render('#turnstile',{
      sitekey:SITE_KEY,
      action:'rsvp_submit',
      callback:value=>{token=value||'';setReady(Boolean(token));},
      'expired-callback':()=>{token='';setReady(false);},
      'error-callback':code=>{
        token='';
        setReady(false);
        document.getElementById('out').textContent='Turnstile error: '+String(code||'desconocido');
      }
    });
  }catch(error){
    statusNode.innerHTML='<strong>Turnstile:</strong> error al inicializar ✕';
    document.getElementById('out').textContent='ERROR TURNSTILE\n'+String(error?.message||error);
  }
}
let checks=0;
const timer=setInterval(()=>{
  checks+=1;
  if(window.turnstile){clearInterval(timer);render();return;}
  if(checks>=100){
    clearInterval(timer);
    statusNode.innerHTML='<strong>Turnstile:</strong> el script no cargó ✕';
    document.getElementById('out').textContent='No cargó https://challenges.cloudflare.com/turnstile/v0/api.js';
  }
},100);
document.getElementById('verify').addEventListener('click',async()=>{
  const out=document.getElementById('out');
  token=token||(widgetId!==null&&window.turnstile?turnstile.getResponse(widgetId):'');
  if(!token){out.textContent='Turnstile cargó, pero todavía no entregó token.';setReady(false);return;}
  const started=Date.now();
  await new Promise(r=>setTimeout(r,1300));
  try{
    const res=await fetch(ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        turnstileToken:token,
        rsvpToken:RSVP_TOKEN,
        responseId:RESPONSE_ID,
        elapsedMs:Date.now()-started+1300,
        website:''
      })
    });
    const body=await res.json().catch(()=>({}));
    out.textContent='HTTP '+res.status+'\n'+JSON.stringify(body,null,2);
    token='';
    setReady(false);
    if(widgetId!==null)turnstile.reset(widgetId);
  }catch(error){
    out.textContent='ERROR\n'+String(error?.message||error);
  }
});
</script>
</body>
</html>
