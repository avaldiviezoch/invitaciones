<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Mi Lu Gran Día · Inicio</title>
<link rel="stylesheet" href="src/modules/dashboard/inicio.css">
</head>
<body class="auth-pending">
<main class="home">
  <video class="hero-video" autoplay muted loop playsinline preload="auto" aria-label="Video de un anillo de boda">
    <source src="https://avaldiviezoch.github.io/Wedding/anillo_loop_planifcador.mp4" type="video/mp4">
  </video>
  <div class="shade" aria-hidden="true"></div>
  <button id="menuButton" class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <section id="accountCard" class="account-card" hidden>
      <img id="accountAvatar" class="avatar" alt="">
      <div><strong id="accountName">Mi cuenta</strong><span id="accountEmail"></span></div>
      <button id="logoutButton" type="button">Cerrar sesión</button>
    </section>
    <header><span>GESTIÓN INTEGRAL</span><h1>Planificador de bodas</h1><p>Primera cara de la nueva Mi Lu Gran Día.</p></header>
    <section class="modules" aria-label="Módulos">
      <button type="button" data-test-button>Planificación</button>
      <button type="button" data-test-button>Espacio de la boda</button>
      <button type="button" data-test-button>En la boda</button>
    </section>
    <small class="test-note">Ambiente controlado · los módulos todavía no navegan.</small>
  </aside>
</main>
<section id="authOverlay" class="auth-overlay" aria-hidden="true">
  <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <h2 id="authTitle">Tu boda, siempre contigo</h2>
    <p>Ingresa con una cuenta ya registrada en Mi Gran Día.</p>
    <button id="googleLoginButton" class="google" type="button">Continuar con Google</button>
    <div class="divider">o usa tu correo</div>
    <label>Correo<input id="authEmail" type="email" autocomplete="email"></label>
    <label>Contraseña<input id="authPassword" type="password" autocomplete="current-password"></label>
    <button id="emailLoginButton" class="primary" type="button">Ingresar</button>
    <p id="authStatus" class="status" role="status"></p>
    <button id="authCloseButton" class="close" type="button">Cancelar</button>
  </div>
</section>
<script type="module" src="src/modules/dashboard/inicio.js"></script>
</body>
</html>
